$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: production
endpoint_name: insurance-endpoint
model: azureml:insurance_model@latest
environment:
  image: mcr.microsoft.com/azureml/lightgbm-3.3-ubuntu20.04-py38-cpu-inference:latest
  conda_file: scoringConfig.yml
code_configuration:
  code: .
  scoring_script: score.py
instance_type: Standard_DS3_v2
instance_count: 2
request_settings:
  request_timeout_ms: 3000
  max_concurrent_requests_per_instance: 4
liveness_probe:
  initial_delay: 10
  period: 10
  timeout: 2
  success_threshold: 1
  failure_threshold: 30

